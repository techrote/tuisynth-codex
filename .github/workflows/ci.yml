name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            packaging: true
          - os: ubuntu-latest
            python-version: "3.14"
            packaging: false
          - os: windows-latest
            python-version: "3.11"
            packaging: true
          - os: windows-latest
            python-version: "3.14"
            packaging: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install all distributions in editable mode
        run: python -m pip install --no-deps --editable kit --editable aurora --editable loom --editable drift
      - name: Run package checks
        run: python tools/check.py --package all
      - name: Build and smoke-test clean wheels
        if: matrix.packaging
        run: python tools/check.py --package all --packaging
