[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trio-drift"
version = "0.1.0"
description = "A granular air and formant cloud synthesizer for the terminal"
requires-python = ">=3.11"
dependencies = ["trio-kit>=0.1.0,<0.2.0"]

[project.scripts]
drift = "trio_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trio_drift = ["py.typed", "data/presets/*.json", "data/skins/*.toml"]
