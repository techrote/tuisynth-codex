schema = "md-editor-theme/1.1"
id = "mono"
name = "MONO"
instrument = "any"
fps = 24

[palette]
black = "#000000"
white = "#ffffff"
gray = "#888888"

[styles]
background = { fg = "white", bg = "black" }
text = { fg = "white", bg = "black" }
muted = { fg = "gray", bg = "black" }
border = { fg = "gray", bg = "black" }
title = { fg = "white", bg = "black", bold = true }
heading = { fg = "white", bg = "black", bold = true }
accent = { fg = "white", bg = "black", bold = true }
status = { fg = "white", bg = "black" }
warning = { fg = "white", bg = "black", bold = true }
error = { fg = "white", bg = "black", bold = true }
focused = { fg = "black", bg = "white", bold = true }
hover = { fg = "black", bg = "white" }
pressed = { fg = "black", bg = "white", bold = true }
selected = { fg = "black", bg = "white", bold = true }
disabled = { fg = "gray", bg = "black" }
key_white = { fg = "white", bg = "black" }
key_black = { fg = "gray", bg = "black" }
key_pressed = { fg = "black", bg = "white", bold = true }
meter_low = { fg = "gray", bg = "black" }
meter_mid = { fg = "white", bg = "black" }
meter_high = { fg = "white", bg = "black", bold = true }

[glyphs]
density = [" ", ".", ":", "-", "=", "+", "*", "#", "%", "@"]
frame = "ascii"

[ramps]
mono = ["black", "#555555", "gray", "white"]

[art]
logo = "TRIO / MONO"

[fallbacks.ascii]
glyphs = { density = [" ", ".", ":", "+", "#"], frame = "ascii" }
